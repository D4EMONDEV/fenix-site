name: Pages

# Builds the site and publishes it to GitHub Pages.
#
# Runs on every push to main, which is what makes the in-browser editor work:
# saving a page there is a commit, and this turns that commit into the page a
# reader sees a minute or two later.

on:
  push:
    branches: [main]
  # Daily, because the drift this catches happens in the *other* repository:
  # releasing Fenix does not touch this one, so nothing here would rebuild and
  # nothing would notice until somebody edited a page.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Two editors saving within a minute of each other
# should produce two builds in order, not a race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The "last updated" stamp on each page reads the file's history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the build, not after: a page telling a reader to depend on a
      # version that was never released is worse than a page that is briefly
      # missing, and this is the only moment the two repositories are compared.
      - name: Check the coordinates against the released versions
        run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
